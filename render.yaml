services:
  # 1. Express + Python ML Backend Web Service
  - type: web
    name: kisansetu-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "cd backend && npm install && pip install -r requirements.txt"
    startCommand: "cd backend && node server.js"
    envVars:
      - key: PORT
        value: 5001
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false

  # 2. React + Vite Frontend Static Site
  - type: web
    name: kisansetu-frontend
    env: static
    region: singapore
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: kisansetu-backend
          property: url
